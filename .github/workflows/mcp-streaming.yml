name: MCP streaming
on:
  pull_request:
    paths: ["src/truthound/__init__.py", "src/truthound/_lazy.py", "src/truthound/mcp/bound_services.py", "src/truthound/mcp/checkpoint_services.py", "src/truthound/mcp/model_process.py", "src/truthound/mcp/brokers.py", "src/truthound/mcp/broker_worker.py", "src/truthound/mcp/checkpoint_worker.py", "src/truthound/mcp/stream_validation.py", "src/truthound/validators/streaming/**", "src/truthound/realtime/base.py", "tests/test_mcp_native_stream_sessions.py", "tests/test_mcp_plugin_bindings.py", "tests/test_streaming_sources.py", "tests/validators/test_streaming_validators.py", "pyproject.toml", "uv.lock", "verification/ci/requirements-lite.txt", "verification/ci/requirements-streaming.txt", ".github/workflows/mcp-streaming.yml"]
  push:
    branches: [main]
    paths: ["src/truthound/__init__.py", "src/truthound/_lazy.py", "src/truthound/mcp/bound_services.py", "src/truthound/mcp/checkpoint_services.py", "src/truthound/mcp/model_process.py", "src/truthound/mcp/brokers.py", "src/truthound/mcp/broker_worker.py", "src/truthound/mcp/checkpoint_worker.py", "src/truthound/mcp/stream_validation.py", "src/truthound/validators/streaming/**", "src/truthound/realtime/base.py", "tests/test_mcp_native_stream_sessions.py", "tests/test_mcp_plugin_bindings.py", "tests/test_streaming_sources.py", "tests/validators/test_streaming_validators.py", "pyproject.toml", "uv.lock", "verification/ci/requirements-lite.txt", "verification/ci/requirements-streaming.txt", ".github/workflows/mcp-streaming.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcp-streaming-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  streams:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POLARS_MAX_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --extra mcp
      - run: uv pip install --python .venv/bin/python -r verification/ci/requirements-lite.txt -r verification/ci/requirements-streaming.txt
      - name: Verify native sync/async cursors, pipeline and actual loopback Flight
        run: .venv/bin/python -m pytest -q tests/test_mcp_native_stream_sessions.py tests/test_streaming_sources.py tests/validators/test_streaming_validators.py --junitxml=test-artifacts/mcp-streaming.xml -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truthound-mcp-streaming
          path: test-artifacts/mcp-streaming.xml
          if-no-files-found: error

name: MCP installed runtime diagnostic (not a release gate)
on:
  workflow_dispatch:
    inputs:
      python_version:
        description: Match the failing installed-runtime interpreter
        type: choice
        options: ["3.11", "3.13"]
        default: "3.13"
permissions:
  contents: read
jobs:
  windows-installed-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      POLARS_MAX_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --python "${{ inputs.python_version }}" --frozen --extra dev --extra mcp
      - run: uv run --python "${{ inputs.python_version }}" --frozen --extra dev --extra mcp python verification/mcp_release.py --expected-python "${{ inputs.python_version }}" --output dist/mcp --smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truthound-installed-runtime-diagnostic
          path: |
            dist/mcp/*.whl
            dist/mcp/*.tar.gz
            dist/mcp/*.mcpb
            dist/mcp/runtime-proofs.json
            dist/mcp/SHA256SUMS
          if-no-files-found: error

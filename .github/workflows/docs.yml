name: Docs

on:
  workflow_call:
  merge_group:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/docs.yml", "docs/**", "mkdocs.yml", "mkdocs.public.yml", "pyproject.toml", "uv.lock", "src/**", "!src/truthound/mcp/**", "tests/cli_modules/test_plugins_cli.py", "tests/test_docs*.py", "tests/test_public_surface.py", "verification/ci/requirements-lite.txt"]
  push:
    branches: [main]
    paths: [".github/workflows/docs.yml", "docs/**", "mkdocs.yml", "mkdocs.public.yml", "pyproject.toml", "uv.lock", "src/**", "!src/truthound/mcp/**", "tests/cli_modules/test_plugins_cli.py", "tests/test_docs*.py", "tests/test_public_surface.py", "verification/ci/requirements-lite.txt"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4

      - name: Install only documentation and lightweight test dependencies
        run: |
          uv sync --frozen --extra docs
          uv pip install --python .venv/bin/python -r verification/ci/requirements-lite.txt

      - name: Stage full docs
        run: .venv/bin/python docs/scripts/prepare_public_docs.py --mode full

      - name: Stage public docs
        run: .venv/bin/python docs/scripts/prepare_public_docs.py --mode public

      - name: Check markdown links
        run: .venv/bin/python docs/scripts/check_links.py --mkdocs mkdocs.yml README.md CLAUDE.md build/full-docs

      - name: Check public markdown links
        run: .venv/bin/python docs/scripts/check_links.py --mkdocs mkdocs.public.yml build/public-docs

      - name: Verify docs and public API surface alignment
        run: .venv/bin/python -m pytest -q tests/test_docs_surface_alignment.py tests/test_public_surface.py -p no:cacheprovider

      - name: Build full docs
        run: .venv/bin/mkdocs build --strict

      - name: Verify full Korean docs including optional Core UI references
        run: .venv/bin/python docs/scripts/verify_korean_docs.py --site-dir site --surface full

      - name: Build public docs
        run: .venv/bin/mkdocs build --strict -f mkdocs.public.yml

      - name: Verify docs public portal
        run: .venv/bin/python -m pytest -q tests/test_docs_public_portal.py -p no:cacheprovider

      - name: Verify generated public surface
        run: .venv/bin/python docs/scripts/verify_public_surface.py --manifest docs/public_docs.yml --site-dir site

      - name: Verify generated Korean docs
        run: .venv/bin/python docs/scripts/verify_korean_docs.py --site-dir site

      - name: Verify public deployment identity
        run: |
          .venv/bin/python -m pytest -q tests/test_docs_deployment_identity.py -p no:cacheprovider
          .venv/bin/python docs/scripts/write_deployment_manifest.py --site-dir site

      - name: Verify plugins CLI snapshot
        run: .venv/bin/python -m pytest -q tests/cli_modules/test_plugins_cli.py -p no:cacheprovider

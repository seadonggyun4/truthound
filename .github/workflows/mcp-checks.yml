name: MCP checks
on:
  pull_request:
    paths: ["src/**", "tests/test_mcp*.py", "server.json", "pyproject.toml", "uv.lock", "conftest.py", "pytest.ini", ".github/workflows/mcp-checks.yml", "verification/ci/requirements-lite.txt"]
  push:
    branches: [main]
    paths: ["src/**", "tests/test_mcp*.py", "server.json", "pyproject.toml", "uv.lock", "conftest.py", "pytest.ini", ".github/workflows/mcp-checks.yml", "verification/ci/requirements-lite.txt"]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcp-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POLARS_MAX_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --extra mcp
      - run: uv pip install --python .venv/bin/python -r verification/ci/requirements-lite.txt
      - name: Verify actual stdio, data privacy, errors, bundle and registry contracts
        run: .venv/bin/python -m pytest -q tests/test_mcp.py tests/test_mcp_faults.py tests/test_mcp_bundle.py tests/test_mcp_environment.py tests/test_mcp_dtype_privacy.py tests/test_mcp_registry.py --junitxml=test-artifacts/mcp-checks.xml -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truthound-mcp-checks
          path: test-artifacts/mcp-checks.xml
          if-no-files-found: error

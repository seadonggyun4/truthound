name: OpenAI local plugin
on:
  workflow_call:
  merge_group:
  push:
    branches: [main]
    paths: ["plugins/truthound/**", "plugins/truthound-core/**", "verification/core_plugin.py", "verification/plugin_marketplace.py", "src/truthound/mcp/consent.py", ".agents/plugins/marketplace.json", "verification/openai_plugin.py", "verification/schemas/agent-plugins-1.0.0-*.schema.json", "tests/test_openai_plugin.py", "tests/test_core_plugin_packaging.py", ".github/workflows/openai-plugin.yml"]
  pull_request:
    paths: ["plugins/truthound/**", "plugins/truthound-core/**", "verification/core_plugin.py", "verification/plugin_marketplace.py", "src/truthound/mcp/consent.py", ".agents/plugins/marketplace.json", "verification/openai_plugin.py", "verification/schemas/agent-plugins-1.0.0-*.schema.json", "tests/test_openai_plugin.py", "tests/test_core_plugin_packaging.py", ".github/workflows/openai-plugin.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  local-plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      POLARS_MAX_THREADS: "1"
    steps:
      # Compare wheel bytes against the public artifact without OS line-ending conversion.
      - name: Preserve Git source bytes for wheel verification
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global @openai/codex@0.141.0
      - name: Install through the actual Codex marketplace client
        run: |
          python verification/plugin_marketplace.py --output "${{ runner.temp }}/truthound-plugin-fixture"
          codex plugin marketplace add "${{ runner.temp }}/truthound-plugin-fixture" --json
          codex plugin add truthound@truthound-development --json
          codex plugin add truthound-core@truthound-development --json
      - run: uv sync --frozen --extra dev --extra mcp
      - run: uv run --frozen --extra dev --extra mcp python -m pytest -q tests/test_openai_plugin.py tests/test_core_plugin_packaging.py -p no:cacheprovider
      - run: uv run --frozen --extra dev --extra mcp python verification/openai_plugin.py --output dist/openai-plugin --smoke --check-codex
      - run: uv build --wheel --out-dir dist/core-plugin-wheel
      - run: uv run --frozen --extra dev --extra mcp python verification/core_plugin.py --output dist/core-plugin --smoke --check-codex
      - name: Verify unpublished candidate with both client launchers before publication
        run: uv run --frozen --extra dev --extra mcp python verification/core_plugin.py --output dist/core-plugin-candidate --candidate-wheel dist/core-plugin-wheel --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: truthound-openai-plugin-${{ matrix.os }}
          path: dist/openai-plugin/*
      - uses: actions/upload-artifact@v4
        with:
          name: truthound-core-plugin-${{ matrix.os }}
          path: dist/core-plugin/*
      - uses: actions/upload-artifact@v4
        with:
          name: truthound-core-plugin-candidate-${{ matrix.os }}
          path: dist/core-plugin-candidate/verification.json

name: OpenAI local plugin
on:
  push:
    paths: ["plugins/truthound/**", ".agents/plugins/marketplace.json", "verification/openai_plugin.py", "verification/schemas/agent-plugins-1.0.0-*.schema.json", "tests/test_openai_plugin.py", ".github/workflows/openai-plugin.yml"]
  pull_request:
    paths: ["plugins/truthound/**", ".agents/plugins/marketplace.json", "verification/openai_plugin.py", "verification/schemas/agent-plugins-1.0.0-*.schema.json", "tests/test_openai_plugin.py", ".github/workflows/openai-plugin.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      POLARS_MAX_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global @openai/codex@0.141.0
      - name: Install through the actual Codex marketplace client
        run: |
          codex plugin marketplace add . --json
          codex plugin add truthound@truthound --json
      - run: uv sync --frozen --extra dev --extra mcp
      - run: uv run --frozen --extra dev --extra mcp python -m pytest -q tests/test_openai_plugin.py -p no:cacheprovider
      - run: uv run --frozen --extra dev --extra mcp python verification/openai_plugin.py --output dist/openai-plugin --smoke --check-codex
      - uses: actions/upload-artifact@v4
        with:
          name: truthound-openai-plugin-${{ matrix.os }}
          path: dist/openai-plugin/*

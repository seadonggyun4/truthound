name: MCP distribution
on:
  pull_request:
    paths: ["src/**", "tests/test_mcp*.py", "tests/test_polars_dependency_contract.py", "tests/fixtures/mcp_*.py", "tests/conftest.py", "conftest.py", "pytest.ini", "setup.cfg", ".python-version", "verification/mcp*.py", "verification/schemas/**", "server.json", "README.md", "README.en.md", "pyproject.toml", "uv.lock", ".github/workflows/mcp.yml", ".github/workflows/release-pypi.yml"]
  push:
    paths: ["src/**", "tests/test_mcp*.py", "tests/test_polars_dependency_contract.py", "tests/fixtures/mcp_*.py", "tests/conftest.py", "conftest.py", "pytest.ini", "setup.cfg", ".python-version", "verification/mcp*.py", "verification/schemas/**", "server.json", "README.md", "README.en.md", "pyproject.toml", "uv.lock", ".github/workflows/mcp.yml", ".github/workflows/release-pypi.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      POLARS_MAX_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --python ${{ matrix.python }} --frozen --extra dev --extra mcp
      - run: uv run --python ${{ matrix.python }} --frozen --extra dev --extra mcp python verification/mcp_ci_gate.py --expected-python ${{ matrix.python }} --junitxml test-artifacts/mcp.xml
      - run: uv run --python ${{ matrix.python }} --frozen --extra dev --extra mcp python verification/mcp_release.py --expected-python ${{ matrix.python }} --output dist/mcp --smoke
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate dist/mcp/extension/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: truthound-mcp-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/mcp/*.whl
            dist/mcp/*.tar.gz
            dist/mcp/*.mcpb
            dist/mcp/SHA256SUMS
            dist/mcp/runtime-proofs.json
            test-artifacts/mcp.xml

name: MCP distribution
on:
  workflow_call:
    inputs:
      full_compatibility:
        type: boolean
        default: true
  pull_request:
    paths: ["src/**", "tests/**", "verification/**", "server.json", "README*", "pyproject.toml", "uv.lock", "conftest.py", "pytest.ini", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "verification/**", "server.json", "README*", "pyproject.toml", "uv.lock", "conftest.py", "pytest.ini", ".github/workflows/**"]
  merge_group:
  schedule:
    - cron: "0 19 * * 3"
  workflow_dispatch:
    inputs:
      full_compatibility:
        description: Verify installed artifacts and platform boundaries on every supported OS/Python
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: mcp-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  POLARS_MAX_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
jobs:
  mcp-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: astral-sh/setup-uv@v4
      - name: Install native PDF provider prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpango-1.0-0 libpangoft2-1.0-0 poppler-utils fonts-noto-cjk
      - run: uv sync --python 3.11 --frozen --extra dev --extra mcp
      - run: uv run --frozen --extra dev --extra mcp python verification/mcp_ci_gate.py --expected-python 3.11 --shard-count 4 --shard-index ${{ matrix.shard }} --junitxml test-artifacts/mcp-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truthound-mcp-tests-${{ matrix.shard }}
          path: test-artifacts/*
          if-no-files-found: error
          retention-days: 7
  native-container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --python 3.11 --frozen --extra dev --extra mcp
      - run: docker pull python:3.11-slim
      - run: uv run --frozen --extra dev --extra mcp python verification/native_container_probe.py --output test-artifacts/native-container.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truthound-native-container
          path: test-artifacts/native-container.json
          if-no-files-found: error
          retention-days: 7
  native-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v4
      - name: Install native Graphviz and Unicode fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y graphviz fonts-noto-cjk
      - run: uv sync --python 3.11 --frozen --extra mcp --extra lineage-visualization
      - run: uv run --frozen --extra mcp --extra lineage-visualization python verification/native_lineage_render_probe.py --output test-artifacts/native-lineage.json --web-cases test-artifacts/lineage-web-cases.json
      - run: npm ci --prefix verification/lineage-web --ignore-scripts --no-audit --no-fund
      - run: node verification/lineage-web/verify.mjs --input test-artifacts/lineage-web-cases.json --output test-artifacts/native-lineage-web.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truthound-native-lineage
          path: test-artifacts/*lineage*.json
          if-no-files-found: error
          retention-days: 7
  build:
    needs: [mcp-tests, native-container, native-lineage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --extra dev --extra mcp
      - uses: actions/download-artifact@v4
        with:
          pattern: truthound-mcp-tests-*
          path: test-artifacts/shards
          merge-multiple: true
      - run: uv run --frozen --extra dev --extra mcp python verification/mcp_ci_gate.py --expected-python 3.11 --aggregate-dir test-artifacts/shards --shard-count 4 --junitxml test-artifacts/mcp.xml
      - run: uv run --frozen --extra dev --extra mcp python verification/mcp_release.py --expected-python 3.11 --output dist/mcp
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate dist/mcp/extension/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: truthound-mcp-canonical
          path: |
            dist/mcp/*.whl
            dist/mcp/*.tar.gz
            dist/mcp/*.mcpb
            dist/mcp/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: truthound-mcp-full-proof
          path: test-artifacts/mcp.*
          if-no-files-found: error
          retention-days: 7
  platform-contracts:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'schedule' || inputs.full_compatibility) && '[{"os":"ubuntu-latest","python":"3.12","shard":0,"count":1},{"os":"ubuntu-latest","python":"3.13","shard":0,"count":1},{"os":"windows-latest","python":"3.11","shard":0,"count":2},{"os":"windows-latest","python":"3.11","shard":1,"count":2},{"os":"windows-latest","python":"3.12","shard":0,"count":2},{"os":"windows-latest","python":"3.12","shard":1,"count":2},{"os":"windows-latest","python":"3.13","shard":0,"count":2},{"os":"windows-latest","python":"3.13","shard":1,"count":2},{"os":"macos-latest","python":"3.11","shard":0,"count":1},{"os":"macos-latest","python":"3.12","shard":0,"count":1},{"os":"macos-latest","python":"3.13","shard":0,"count":1}]' || '[{"os":"ubuntu-latest","python":"3.13","shard":0,"count":1},{"os":"windows-latest","python":"3.11","shard":0,"count":2},{"os":"windows-latest","python":"3.11","shard":1,"count":2},{"os":"macos-latest","python":"3.11","shard":0,"count":1}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --python ${{ matrix.python }} --frozen --extra dev --extra mcp
      - name: Verify platform-sensitive contracts with source and execution identity
        run: uv run --python ${{ matrix.python }} --frozen --extra dev --extra mcp python verification/mcp_ci_gate.py --scope boundary --expected-python ${{ matrix.python }} --shard-count ${{ matrix.count }} --shard-index ${{ matrix.shard }} --junitxml test-artifacts/mcp-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truthound-mcp-boundary-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.shard }}
          path: test-artifacts/mcp-*
          if-no-files-found: error
          retention-days: 7
  compatibility:
    needs: [build, platform-contracts]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'schedule' || inputs.full_compatibility) && '[{"os":"ubuntu-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.13"},{"os":"windows-latest","python":"3.11"},{"os":"windows-latest","python":"3.12"},{"os":"windows-latest","python":"3.13"},{"os":"macos-latest","python":"3.11"},{"os":"macos-latest","python":"3.12"},{"os":"macos-latest","python":"3.13"}]' || '[{"os":"ubuntu-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.13"},{"os":"windows-latest","python":"3.11"},{"os":"macos-latest","python":"3.11"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --python ${{ matrix.python }} --frozen --extra dev --extra mcp
      - uses: actions/download-artifact@v4
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.11'
        with:
          pattern: truthound-mcp-boundary-${{ matrix.os }}-${{ matrix.python }}-*
          path: test-artifacts/boundary-shards
          merge-multiple: true
      - name: Require complete disjoint platform execution before installation
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.11'
        run: uv run --python ${{ matrix.python }} --frozen --extra dev --extra mcp python verification/mcp_ci_gate.py --scope boundary --expected-python ${{ matrix.python }} --aggregate-dir test-artifacts/boundary-shards --shard-count ${{ matrix.os == 'windows-latest' && 2 || 1 }} --junitxml test-artifacts/boundary.xml
      - uses: actions/download-artifact@v4
        with:
          name: truthound-mcp-canonical
          path: canonical
      - name: Install exact canonical files without rebuilding the checkout
        run: uv run --python ${{ matrix.python }} --frozen --extra dev --extra mcp python verification/mcp_release.py --expected-python ${{ matrix.python }} --from-artifacts canonical --output dist/mcp --smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truthound-mcp-runtime-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/mcp/runtime-proofs.json
            dist/mcp/SHA256SUMS
            test-artifacts/boundary.*
          if-no-files-found: error
          retention-days: 7
  mcp-gate:
    if: always()
    needs: [mcp-tests, build, platform-contracts, compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed, cancelled or missing required execution
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert set(results) == {'mcp-tests', 'build', 'platform-contracts', 'compatibility'}
          assert all(job['result'] == 'success' for job in results.values()), results
          PY

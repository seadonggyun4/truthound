name: MCP distribution
on:
  pull_request:
    paths: ["src/**", "tests/test_mcp*.py", "tests/mcp_*.py", "tests/test_core_*.py", "tests/test_reference_cache.py", "tests/test_validators_drift.py", "tests/unit/validators/test_pushdown_support.py", "tests/test_polars_dependency_contract.py", "tests/fixtures/mcp_*.py", "tests/conftest.py", "conftest.py", "pytest.ini", "setup.cfg", ".python-version", "verification/mcp*.py", "verification/schemas/**", "server.json", "README.md", "README.en.md", "pyproject.toml", "uv.lock", ".github/workflows/mcp.yml", ".github/workflows/release-pypi.yml"]
  push:
    paths: ["src/**", "tests/test_mcp*.py", "tests/mcp_*.py", "tests/test_core_*.py", "tests/test_reference_cache.py", "tests/test_validators_drift.py", "tests/unit/validators/test_pushdown_support.py", "tests/test_polars_dependency_contract.py", "tests/fixtures/mcp_*.py", "tests/conftest.py", "conftest.py", "pytest.ini", "setup.cfg", ".python-version", "verification/mcp*.py", "verification/schemas/**", "server.json", "README.md", "README.en.md", "pyproject.toml", "uv.lock", ".github/workflows/mcp.yml", ".github/workflows/release-pypi.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      POLARS_MAX_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --python ${{ matrix.python }} --frozen --extra dev --extra mcp
      - run: uv run --python ${{ matrix.python }} --frozen --extra dev --extra mcp python verification/mcp_ci_gate.py --expected-python ${{ matrix.python }} --shard-count 8 --shard-index ${{ matrix.shard }} --junitxml test-artifacts/mcp-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truthound-mcp-tests-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.shard }}
          path: test-artifacts/*
          if-no-files-found: error
  mcp:
    needs: mcp-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      POLARS_MAX_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --python ${{ matrix.python }} --frozen --extra dev --extra mcp
      - uses: actions/download-artifact@v4
        with:
          pattern: truthound-mcp-tests-${{ matrix.os }}-${{ matrix.python }}-*
          path: test-artifacts/shards
          merge-multiple: true
      - run: uv run --python ${{ matrix.python }} --frozen --extra dev --extra mcp python verification/mcp_ci_gate.py --expected-python ${{ matrix.python }} --aggregate-dir test-artifacts/shards --shard-count 8 --junitxml test-artifacts/mcp.xml
      - run: uv run --python ${{ matrix.python }} --frozen --extra dev --extra mcp python verification/mcp_release.py --expected-python ${{ matrix.python }} --output dist/mcp --smoke
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate dist/mcp/extension/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truthound-mcp-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/mcp/*.whl
            dist/mcp/*.tar.gz
            dist/mcp/*.mcpb
            dist/mcp/SHA256SUMS
            dist/mcp/runtime-proofs.json
            test-artifacts/mcp.xml
            test-artifacts/mcp.sources.json

name: MCP distribution
on:
  pull_request:
    paths: ["src/truthound/mcp/**", "src/truthound/cli_modules/mcp.py", "src/truthound/cli_modules/registry.py", "tests/test_mcp*.py", "verification/mcp*.py", "pyproject.toml", "uv.lock", ".github/workflows/mcp.yml"]
  push:
    paths: ["src/truthound/mcp/**", "src/truthound/cli_modules/mcp.py", "src/truthound/cli_modules/registry.py", "tests/test_mcp*.py", "verification/mcp*.py", "pyproject.toml", "uv.lock", ".github/workflows/mcp.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      POLARS_MAX_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --extra dev --extra mcp
      - run: uv run --frozen --extra dev --extra mcp python -m pytest -q tests/test_mcp.py tests/test_mcp_bundle.py tests/test_mcp_faults.py -p no:cacheprovider
      - run: uv run --frozen --extra dev --extra mcp python verification/mcp_release.py --output dist/mcp --smoke
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate dist/mcp/extension/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: truthound-mcp-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/mcp/*.whl
            dist/mcp/*.tar.gz
            dist/mcp/*.mcpb
            dist/mcp/SHA256SUMS
